!DOCTYPE <html>
<html lang="en">
    <head>
        <title>welcome alert</title>
        <h1>Welcome Alert</h1>
    </head>
    <body>
        <script>
            function showUserWelcome(username){
                alert("welcome  back. " + username + "!");
            }
            let name =prompt("Enter your name: ");
            showUserWelcome(name);
        </script>
    </body>
</html>
