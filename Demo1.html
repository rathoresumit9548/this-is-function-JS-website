        <h1>Sum of natural number</h1>
<br>
         function sumofNaturalNumber(limit){
            <br>
                    let sum = 0;
                    <br>

                    for(let i = 1; i <= limit; i++){
                        <br>
                        sum = sum + i;
                        <br>
                    }
                    return sum;
                    <br>
                }
                let result = sumofNaturalNumber(10);
                <br>
                console.log(result);
        <body>
            <script>
                function sumofNaturalNumber(limit){
                    let sum = 0;
                    for(let i = 1; i <= limit; i++){
                        sum = sum + i;
                    }
                    return sum;
                }
                let result = sumofNaturalNumber(10);
                console.log(result);
            </script>
        </body>
